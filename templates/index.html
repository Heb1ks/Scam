<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scam</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 CS2 Betting Platform</h1>
            <div id="user-info" class="user-info" style="display: none;">
                <span id="username-display"></span>
                <span id="balance-display" class="balance">Balance: $0.00</span>
                <button onclick="logout()" class="btn btn-secondary">Logout</button>
            </div>
        </header>

        <div id="auth-section" class="auth-section">
            <div class="auth-tabs">
                <button onclick="showLogin()" class="tab-btn active" id="login-tab">Login</button>
                <button onclick="showRegister()" class="tab-btn" id="register-tab">Register</button>
            </div>

            <div id="login-form" class="auth-form">
                <h2>Login</h2>
                <input type="email" id="login-email" placeholder="Email" class="input">
                <input type="password" id="login-password" placeholder="Password" class="input">
                <button onclick="login()" class="btn btn-primary">Login</button>
            </div>

            <div id="register-form" class="auth-form" style="display: none;">
                <h2>Register</h2>
                <input type="text" id="register-username" placeholder="Username" class="input">
                <input type="email" id="register-email" placeholder="Email" class="input">
                <input type="password" id="register-password" placeholder="Password" class="input">
                <button onclick="register()" class="btn btn-primary">Register</button>
            </div>
        </div>

        <div id="main-content" style="display: none;">

            <div class="tabs">
                <button onclick="showMatches()" class="tab-btn active" id="matches-tab">Matches</button>
                <button onclick="showMyBets()" class="tab-btn" id="bets-tab">My Bets</button>
                <button onclick="showAdmin()" class="tab-btn" id="admin-tab">Admin</button>
            </div>

            <div id="matches-section" class="content-section">
                <h2>Available Matches</h2>
                <div class="filters">
                    <button onclick="filterMatches('all')" class="btn btn-secondary">All</button>
                    <button onclick="filterMatches('upcoming')" class="btn btn-secondary">Upcoming</button>
                    <button onclick="filterMatches('live')" class="btn btn-secondary">Live</button>
                    <button onclick="filterMatches('finished')" class="btn btn-secondary">Finished</button>
                </div>
                <div id="matches-list" class="matches-list"></div>
            </div>

            <div id="bets-section" class="content-section" style="display: none;">
                <h2>My Bets</h2>
                <div id="bets-list" class="bets-list"></div>
            </div>

            <div id="admin-section" class="content-section" style="display: none;">
                <h2>Admin Panel</h2>
                
                <div class="admin-card">
                    <h3>Create Match</h3>
                    <input type="text" id="team-a-name" placeholder="Team A Name" class="input">
                    <input type="text" id="team-a-logo" placeholder="Team A Logo URL" class="input">
                    <input type="text" id="team-b-name" placeholder="Team B Name" class="input">
                    <input type="text" id="team-b-logo" placeholder="Team B Logo URL" class="input">
                    <input type="text" id="tournament" placeholder="Tournament" class="input">
                    <select id="format" class="input">
                        <option value="BO1">BO1</option>
                        <option value="BO3">BO3</option>
                        <option value="BO5">BO5</option>
                    </select>
                    <input type="datetime-local" id="start-time" class="input">
                    <button onclick="createMatch()" class="btn btn-primary">Create Match</button>
                </div>

                <div class="admin-card">
                    <h3>Settle Match</h3>
                    <input type="text" id="settle-match-id" placeholder="Match ID" class="input">
                    <select id="winner" class="input">
                        <option value="team_a">Team A Wins</option>
                        <option value="team_b">Team B Wins</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <button onclick="settleMatch()" class="btn btn-primary">Settle Match</button>
                </div>

                <div class="admin-card">
                    <h3>Add Balance (Testing)</h3>
                    <input type="number" id="add-balance-amount" placeholder="Amount" class="input">
                    <button onclick="addBalance()" class="btn btn-primary">Add Balance</button>
                </div>
            </div>
        </div>
    </div>

    <div id="bet-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeBetModal()">&times;</span>
            <h2>Place Bet</h2>
            <div id="bet-match-info"></div>
            <div class="bet-options">
                <div class="bet-option" id="bet-team-a">
                    <h3 id="bet-team-a-name"></h3>
                    <p class="odds" id="bet-team-a-odds"></p>
                </div>
                <div class="bet-option" id="bet-team-b">
                    <h3 id="bet-team-b-name"></h3>
                    <p class="odds" id="bet-team-b-odds"></p>
                </div>
            </div>
            <input type="number" id="bet-amount" placeholder="Bet Amount" class="input" min="1">
            <div id="potential-win" class="potential-win"></div>
            <button onclick="placeBet()" class="btn btn-primary">Place Bet</button>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
